{% extends "template.html" %}

{% block content %}
<style>
  #header{
    background-color: #302b2b ;
  }
  .cta {
  background: fixed center center;
  background-color: #302b2b;
  background-size: cover;
  padding: 60px 0;
}
#contact{
  margin-top: 100px;

}
.submit{
    border: none;
    outline: none;
    height: 45px;
    background: #ffc451;
    border-radius: 5px;
    transition: .4s;
}
.submit:hover{
    background:#ad883e;
    color: #fff;
}
</style>
<div class="container my-10"  id="contact">
  <div class="row justify-content-center align-items-center">
    <div class="col-md-8">
      <form action="{{ url_for('contac')}}" method="post" class="border p-4">
        <div class="form-group text-center">
        <h2 id="head" class="mb-4">Contactez-nous</h2>
        </div>
        <div class="form-group">
          <label for="name">Nom :</label>
          <input type="text" id="name" name="name" class="form-control">
        </div>

        <div class="form-group">
          <label for="email">Email :</label>
          <input type="email" id="email" name="email" class="form-control">
        </div>

        <div class="form-group">
          <label for="message">Message :</label>
          <textarea id="message" name="message" class="form-control"></textarea>
        </div>
        <div class="form-group text-center">
        <input type="submit" value="Envoyer"  class="submit">
        </div>

      </form>
      <p>



      </p>

  
    </div>
  </div>
</div>
<script>
  function validateEmail() {
    var email = document.getElementById("email").value;
    var regex = /^\w+([\.-]?\w+)*@gmail\.com$/; // Regex pour vérifier la validité de l'adresse Gmail
    if (regex.test(email)) {
      return true;
    } else {
      alert("Veuillez saisir une adresse Gmail valide.");
      return false;
    }
  }
  document.querySelector('form').addEventListener('submit', validateEmail);
  </script>
  

{% endblock %}
