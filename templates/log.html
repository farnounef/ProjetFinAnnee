{% extends "template.html" %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');

*{
    font-family: 'Poppins', sans-serif;
}
form{
    margin-top: 0px;
}
.wrapper{
    /* background: #ffff; */
    background-image:url("../static/assets/img/imageensa.jpg") ;
    padding: 0 20px 0 20px;
    background: fixed;

}
.main{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
#log{
    margin-top: 100px;
    width: 900px;
    height: 500px;
    border-radius: 10px;
    background: #ffff;
    box-shadow: 5px 5px 10px 1px rgba(0,0,0,0.2);
}
#header{
    background-color: #302b2b ;
}
.side-image{
    background-image: url("../static/assets/img/ensaj.jpg");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    position: relative;
    border-radius: 10px 0 0 10px;
}

.text{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
.text p{
    color: #302b2b;
    font-size: 18px;
}
i{
    font-weight: 400;
    font-size: 15px;
}
.right{
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}
.input-box{
    width: 330px;
    box-sizing: border-box;
}
.input-box header{
    font-weight: 700;
    text-align: center;
    margin-bottom: 45px;
}
.input-field{
    display: flex;
    flex-direction: column;
    position: relative;
    padding: 0 10px 0 10px;
}
.input{
    height: 45px;
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(0,0,0,0.2);
    outline: none;
    margin-bottom: 20px;
    color: #302b2b;
}
#foot{
    background-color :#302b2b;
}
.input-box .input-field label{
    position: absolute;
    top: 10px;
    left: 10px;
    pointer-events: none;
    transition: .5s;
}
.input-field .input:focus ~ label{
    top: -10px;
    font-size: 13px;
}
.input-field .input:valid ~ label{
    top: -10px;
    font-size: 13px;
    color: #302b2b;
}
.input-field .input:focus, .input-field .input:valid{
    border-bottom: 1px solid #302b2b;
}
.submit{
    border: none;
    outline: none;
    height: 45px;
    background: #ffc451;
    border-radius: 5px;
    transition: .4s;
}
.submit:hover{
    background:#ad883e;
    color: #fff;
}
.signin{
    text-align: center;
    font-size: small;
    margin-top: 25px;
}
span a{
    text-decoration: none;
    font-weight: 700;
    color: #000;
    transition: .5s;
}
span a:hover{
    text-decoration: underline;
    color: #000;
}

#head{
    color :#302b2b
}
.cta {
  background: fixed center center;
  background-color: #302b2b;
  background-size: cover;
  padding: 60px 0;
}

@media only screen and (max-width: 768px){
    .side-image{
        border-radius: 10px 10px 0 0;
    }
    img{
        width: 35px;
        position: absolute;
        top: 20px;
        left: 47%;
    }
    .text{
        position: absolute;
        top: 70%;
        text-align: center;
    }
    .text p,i{
        font-size: 17px;
    }
    .row{
        max-width: 420px;
        width: 100%;
    }
}
</style>
<div class="login-container">
  
  {% if error %}
    <p class=error><strong>Error:</strong> {{ error }}
  {% endif %}
  <form action="" method="post">
    <div class="wrapper">
      <div class="container main">
          <div class="row" id="log">
              <div class="col-md-6 side-image">
                  <!-------Image-------->
                  
                  
              </div>
              <div class="col-md-6 right">
                   <div class="input-box">
                      <header ><div id="head">Votre compte</div></header>
                      <div class="input-field">
                          <input type="text" class="input" name=profil required autocomplete="off">
                          <label for="email">Email</label>
                      </div>
                      <div class="input-field">
                          <input type="password" class="input" name=password required>
                          <label for="password">Mot de passe</label>
                      </div>
                      <div class="input-field">
                          <input type="submit" class="submit" value="Se connecter">
                          
                      </div>
                     
                   </div>
              </div>
          </div>
      </div>
  </div>
  </form>
</div>
 
{% endblock %}
