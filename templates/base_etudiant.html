<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-ew6Fp+g8WzBfhSvKdcCg1+bVKp9/gWY/km4vPPODGmKcp0kM8o55I3zNO0xlyclJ/HfN9XW+ogzdVEIHzd0tQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

	<title>SFS</title>
    <style>
 
        .navbar {
            background-color: #333;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
        
        .navbar a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .navbar a:hover {
            color: #ccc;
        }
        main {
            margin-left: 200px; /* ajuster la marge gauche pour tenir compte de la largeur de la nav bar */
          }

        .title-fiche {
            font-size: 30px;
            margin-bottom: 20px;
            text-align: center;
            color:#2368ED;
            flex: 1;
            text-align: center;
        }


        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
          }
          .card-header img {
            flex: 1;
            max-width: 100px;
            height: auto;
          }
          
          .card-body {
            display: flex;
            flex-direction: column;

          }
          .col-md-6 {
            margin: 10px 0;
          }
          
          .title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        

         

    </style>
    
	
</head>
<body>

	<main >
		{% block content %}
     
		{% endblock %}
	</main>


      <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNSBXTp" crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
