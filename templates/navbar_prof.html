<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="{{ url_for('static', filename='sidebar/css/style.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-ew6Fp+g8WzBfhSvKdcCg1+bVKp9/gWY/km4vPPODGmKcp0kM8o55I3zNO0xlyclJ/HfN9XW+ogzdVEIHzd0tQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Varela+Round">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
   
    <title>Espace Professeur</title>
</head>
<body>
   

<style>
    /* Style pour la barre de navigation */
    a{
        font-family: Arial, sans-serif;
        font-size: 16px;
    }
    #titre{
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold; 
    }
    nav {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 220px;
        background-color: #1b1919;
        padding: 20px;
    }


    /* Style pour les liens de la barre de navigation */
    nav a {
        display: block;
        padding: 10px;
        margin-bottom: 10px;
        color: #ffff;
        text-decoration: none;
        font-weight: bold;
        border-radius: 5px;
        transition: background-color 0.3s;
    }

    /* Style pour les liens de la barre de navigation au survol de la souris */
    nav a:hover {
        background-color: #ffff;
    }

    /* Style pour la zone de recherche */
    nav form {
        margin-bottom: 20px;
    }

    /* Style pour le champ de recherche */
    nav input[type="text"] {
        display: block;
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: none;
        box-sizing: border-box;
        margin-bottom: 10px;
        font-size: 14px;
        color: #ffff;
        background-color: #fff;
        box-shadow: 0 2px 2px rgba(0, 0, 0, 0.1);
    }

    /* Style pour le bouton de recherche */
    nav input[type="submit"] {
        display: block;
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: none;
        box-sizing: border-box;
        margin-bottom: 10px;
        font-size: 14px;
        color: #fff;
        background-color: #ffff;
        cursor: pointer;
        box-shadow: 0 2px 2px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s;
    }

    /* Style pour le bouton de recherche au survol de la souris */
    nav input[type="submit"]:hover {
        background-color: #1b1919;
    }
    .logout {
        position: absolute;
        bottom: 0;
        left: 0;
    }
    .btn-custom {
    font-size: 14px;
    }
    .form-control {
        display: block;
        width: 100%;
        margin-bottom: 10px; 
        }

        .btn-custom {
        display: block;
        width: 100%;
        }
        
  
</style>



<nav>
    
    <div class="img bg-wrap text-center py-4" style="background-color:none;"> 
        <div class="user-logo">
            <img class="img" src="{{ url_for('static', filename='images/professeur.png') }}" width="125" height="125" >
            
            <h3 id="titre">Espace Professeur</h3>
        </div>
    </div>
<ul class="list-unstyled components mb-5">
<li class="active">
    <a href="/accprof"><span class="fa fa-home mr-3"></span> Accueil</a>
</li>


<li>
    <a href="javascript:history.back()"><span class="fa fa-arrow-left mr-3"></span> Retour</a>
</li>
<li>
    <a href="/logout"><span class="fa fa-sign-out mr-3"></span> Se déconnecter</a>
</li>
</ul>

</nav> 
<script src="{{ url_for('static', filename='sidebar/js/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='sidebar/js/popper.min.js') }}"></script>
<script src="{{ url_for('static', filename='sidebar/js/bootstrap.min.js') }}"></script>
<script src="{{ url_for('static', filename='sidebar/js/main.js') }}"></script>
</body>
</html>
